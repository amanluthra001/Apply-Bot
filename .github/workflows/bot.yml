name: Auto Apply Bot

on:
  schedule:
    # Runs every 4 hours automatically
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows you to trigger it manually from GitHub

jobs:
  run-bot:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run Auto-Apply Bot
        run: python main.py

      - name: Commit applied_jobs.txt memory
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          touch applied_jobs.txt
          git add applied_jobs.txt
          git commit -m "chore: save applied jobs memory" || echo "No changes to commit"
          git push
